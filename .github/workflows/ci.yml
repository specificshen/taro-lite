name: CI
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read # to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.host }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Typecheck fixtures
        run: bun run typecheck:fixtures
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
      - name: Verify fixture build
        run: bun run verify:fixture:weapp
